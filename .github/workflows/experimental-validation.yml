name: Experimental branch validation

on:
  push:
    branches:
      - exp/chatgpt-followup-20261028
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build game files
        run: python3 build.py

      - name: Run engine and heuristic tests
        run: |
          node tests/rules_real.js
          node tests/t16.js
          node tests/terrain.js
          node tests/ai.js
          node tests/ai_tactics.js
          node tests/bison.js
          node tests/outpost_ai.js

      - name: Compare starting formations
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'feature/online-two-player-pvp' && github.event.pull_request.head.ref != 'fix/online-connection-and-top-panel' && github.event.pull_request.head.ref != 'fix/peerjs-cloud-room-join' && github.event.pull_request.head.ref != 'design/symmetrical-compact-web-ui' && github.event.pull_request.head.ref != 'fix/shared-board-orientation' && github.event.pull_request.head.ref != 'feat/bush-diagonal-slip' && github.event.pull_request.head.ref != 'feat/safari-style-main-menu' && github.event.pull_request.head.ref != 'feat/redesign-main-menu-hub')
        run: node tests/opening_positions.js 8 8 2026102901 110

      - name: Screen rank variants
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'feature/online-two-player-pvp' && github.event.pull_request.head.ref != 'fix/online-connection-and-top-panel' && github.event.pull_request.head.ref != 'fix/peerjs-cloud-room-join' && github.event.pull_request.head.ref != 'design/symmetrical-compact-web-ui' && github.event.pull_request.head.ref != 'fix/shared-board-orientation' && github.event.pull_request.head.ref != 'feat/bush-diagonal-slip' && github.event.pull_request.head.ref != 'feat/safari-style-main-menu' && github.event.pull_request.head.ref != 'feat/redesign-main-menu-hub')
        run: node tests/balance.js 2,3,4,5,6,7 6 8 2026102902

      - name: Run paired-seed outpost simulation
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'feature/online-two-player-pvp' && github.event.pull_request.head.ref != 'fix/online-connection-and-top-panel' && github.event.pull_request.head.ref != 'fix/peerjs-cloud-room-join' && github.event.pull_request.head.ref != 'design/symmetrical-compact-web-ui' && github.event.pull_request.head.ref != 'fix/shared-board-orientation' && github.event.pull_request.head.ref != 'feat/bush-diagonal-slip' && github.event.pull_request.head.ref != 'feat/safari-style-main-menu' && github.event.pull_request.head.ref != 'feat/redesign-main-menu-hub')
        run: |
          set -o pipefail
          node tests/outpost_compare.js 50 25 2026102807 120 | tee outpost-simulation.json

      - name: Run paired-seed crocodile rank 3 vs 4 simulation
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'feature/online-two-player-pvp' && github.event.pull_request.head.ref != 'fix/online-connection-and-top-panel' && github.event.pull_request.head.ref != 'fix/peerjs-cloud-room-join' && github.event.pull_request.head.ref != 'design/symmetrical-compact-web-ui' && github.event.pull_request.head.ref != 'fix/shared-board-orientation' && github.event.pull_request.head.ref != 'feat/bush-diagonal-slip' && github.event.pull_request.head.ref != 'feat/safari-style-main-menu' && github.event.pull_request.head.ref != 'feat/redesign-main-menu-hub')
        run: |
          set -o pipefail
          node tests/croc_rank_compare.js 25 25 2026102808 140 | tee croc-rank-simulation.json

      - name: Install Chromium for Playwright
        working-directory: tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run existing browser regression suite
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'feature/online-two-player-pvp' && github.event.pull_request.head.ref != 'fix/online-connection-and-top-panel' && github.event.pull_request.head.ref != 'fix/peerjs-cloud-room-join' && github.event.pull_request.head.ref != 'design/symmetrical-compact-web-ui' && github.event.pull_request.head.ref != 'fix/shared-board-orientation' && github.event.pull_request.head.ref != 'feat/bush-diagonal-slip' && github.event.pull_request.head.ref != 'feat/safari-style-main-menu' && github.event.pull_request.head.ref != 'feat/redesign-main-menu-hub')
        working-directory: tests
        run: |
          node pw11.js
          node pw12.js
          node pw14.js
          node pw16.js

      - name: Run online multiplayer browser regression
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/shared-board-orientation'
        working-directory: tests
        run: |
          node pw20-ui-symmetry.js
          node pw19-room-link.js

      - name: Upload paired simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-simulation-results
          path: |
            outpost-simulation.json
            croc-rank-simulation.json
          if-no-files-found: ignore
