name: Deploy game to GitHub Pages

# Chạy thủ công. Chỉ dùng được sau khi bật Settings > Pages > Source = "GitHub Actions".
# (Hiện Pages đang deploy từ nhánh main; workflow build-release.yml vẫn giữ nguyên.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build game
        run: python3 build.py
      - name: Prepare _site
        run: |
          mkdir -p _site
          cp dist/game.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
