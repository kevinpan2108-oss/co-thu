name: Bison stun experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/bison_stun_compare.js'
      - '.github/workflows/bison-stun-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run paired Bison stun comparison
        run: |
          set -o pipefail
          node tests/bison_stun_compare.js 15 10 2026102907 100 | tee bison-stun-simulation.json
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bison-stun-simulation-results
          path: bison-stun-simulation.json
          if-no-files-found: ignore
