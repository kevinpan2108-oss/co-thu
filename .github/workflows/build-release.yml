name: Build release game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build release files
        run: python3 build.py

      - name: Commit generated release if changed
        run: |
          if git diff --quiet -- dist/game.html dist/game_local.html; then
            echo 'Release files already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/game.html dist/game_local.html
          git commit -m 'Build release game from source'
          git push
